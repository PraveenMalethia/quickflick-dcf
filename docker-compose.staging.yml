name: quickflick

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/db/mongo-keyfile"]
    volumes:
      - mongo_data:/data/db
    env_file:
      - stack.env

  backend:
    image: praveenmalethia/quick-flick-backend:staging-1dc2680
    restart: unless-stopped
    env_file:
      - stack.env
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/usr/src/app/uploads
      - backend_logs:/usr/src/app/logs

  admin:
    image: praveenmalethia/quick-flick-admin:staging-f871caf
    restart: unless-stopped
    env_file:
      - stack.env
    depends_on:
      - backend

  frontend:
    image: praveenmalethia/quick-flick-frontend:staging-4638f9c
    restart: unless-stopped
    env_file:
      - stack.env
    depends_on:
      - backend

  mongo-express:
    image: mongo-express
    restart: unless-stopped
    env_file:
      - stack.env

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # Self-hosted OSRM router (Northern India extract) — route polylines
  # for the admin tracking map. Serves standard OSRM API on :3000.
  # env_file supplies OSRM_ALGORITHM=MLD — the CH graph (~2.5GB RSS) is
  # OOM-killed on this 16GB zero-swap host; MLD loads in ~1.2GB.
  osrm:
    image: praveenmalethia/quick-flick-osrm:staging-d5f52de
    restart: unless-stopped
    env_file:
      - stack.env

volumes:
  mongo_data:
  backend_uploads:
  backend_logs:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 10.20.0.0/16